services:
  webserver:
    init: true
    build:
      context: build/web
      dockerfile: Dockerfile
    links:
      - database
    ports:
      - "8081:80"
    env_file:
      - .env
    volumes:
      - ./config/web/config.php:/var/www/html/config.php:ro
    depends_on:
      - database
  database:
    image: mariadb:latest
    container_name: "${COMPOSE_PROJECT_NAME}-db"
    restart: "always"
    init: true
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./config/initdb:/docker-entrypoint-initdb.d
      - ./data/mysql:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ${dbname}
      MYSQL_USER: ${dbuser}
      MYSQL_PASSWORD: ${dbpass}
  
  # Go daemon that follows queue_log continuously (replaces the PHP
  # parselog run from cron). Source: parselogd/ in
  # https://github.com/KrzysztofHajdamowicz/asternic-stats-lite
  # The old PHP image can still be built from build/parselog.
  parselog:
    image: ghcr.io/krzysztofhajdamowicz/asternic-parselogd:latest
    restart: always
    links:
      - database
    env_file:
      - .env
    environment:
      CONVERT_LOCAL: "true"
    volumes:
      # Mount the directory, not the file, so log rotation is visible.
      - /var/log/asterisk:/var/log/asterisk:ro
    # Root without any capability except reading files regardless of their
    # permissions, so a queue_log owned by asterisk with mode 0640 is readable.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    read_only: true
    depends_on:
      - database
